[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadirector"
version = "0.1.0"
description = "An implementation of the RDA Data Director Agentic AI Blueprint v1.0"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
dependencies = [
  "datadirector-contracts>=0.1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
datadirector = "datadirector.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/datadirector"]
