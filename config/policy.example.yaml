# Policy configuration. Owned by the data steward or research office.
# Auditable and version-controlled; changes when institutional policy changes.

backend_by_sensitivity:
  public:    [local-qwen, remote-claude]
  internal:  [local-qwen]
  sensitive: [local-qwen]

# The only permitted value. Falling back to a less appropriate backend would be
# a silent downgrade, so an unserviceable classification stops the workflow.
on_no_permitted_backend: halt

# Whether the declaration agent may form its own view of sensitivity from what a
# statement describes, in addition to transcribing what it states. On by default
# because it is what a data steward would do. An inference can only tighten the
# outcome, never relax it (ADR-027). Set false for a strict transcription posture.
infer_sensitivity_from_declaration: true

# Per-workflow oversight mode, which principle P4 requires be documented.
oversight:
  metadata_generation: human-in-the-loop
  redaction_review: human-in-the-loop
  post_deposit_monitoring: human-on-the-loop

# Grace periods before marked working material is deleted. Only published
# material is ever removed on a schedule, and only after the repository has
# confirmed the record still exists: our working copy may be the only copy.
# Material from a job that deliberately did not publish is never removed by a
# schedule at all.
retention_days:
  working_material: 30
  idle_jobs: 180
  unattributed_directories: 180
  restricted_justifications: 3650
