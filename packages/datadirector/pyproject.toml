[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadirector"
version = "0.1.0"
description = "An implementation of the RDA Data Director Agentic AI Blueprint v1.0"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
dependencies = [
  "datadirector-contracts>=0.1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
datadirector = "datadirector.cli:main"

[project.optional-dependencies]
# Pillow supports deterministic structure measurement of images, used to
# contradict a vision model that reports an image as empty when it is not.
# Optional: without it the contradiction check reports "unknown" and is not
# made, so a missing dependency changes nothing about how much an image is
# trusted.
media = ["pillow>=10.0"]
validate = ["jsonschema>=4.20"]
# jinja2 and python-multipart are for the server-rendered interface: templates
# and HTML form posts. A client-side application would have needed neither and a
# build toolchain instead.
api = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1",
      "python-multipart>=0.0.9",
      "markupsafe>=2.1"]
# `dev` deliberately includes every optional extra: a contributor running the
# suite should exercise all of it, while a deployment picks only what it needs.
dev = ["pytest>=8.0", "pytest-cov", "pyflakes>=3.0", "pillow>=10.0",
      "jsonschema>=4.20", "fastapi>=0.110", "uvicorn>=0.27",
      "jinja2>=3.1", "python-multipart>=0.0.9",
      "markupsafe>=2.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/datadirector"]
