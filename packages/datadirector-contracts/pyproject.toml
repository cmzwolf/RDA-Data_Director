[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadirector-contracts"
version = "0.1.0"
description = "Interface contracts for Data Director implementations and plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/OWNER/datadirector"

[tool.hatch.build.targets.wheel]
packages = ["src/datadirector_contracts"]
